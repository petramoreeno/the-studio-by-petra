backend:
  name: github
  repo: petramoreeno/the-studio-by-petra
  branch: main
  base_url: https://mute-sunset-c3dcthe-studio-by-petra-auth.petramoreno-8.workers.dev
  auth_endpoint: auth

media_folder: "the-studio-by-petra-editable-cms/assets/images"
public_folder: "/assets/images"

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "settings"
        label: "Homepage, About & Contact"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "Website name", name: "siteTitle", widget: "string"}
          - {label: "Hero title", name: "heroTitle", widget: "string"}
          - {label: "Hero subtitle", name: "heroSubtitle", widget: "string"}
          - {label: "Hero image", name: "hero", widget: "image", required: false}
          - {label: "Main statement", name: "statement", widget: "string"}
          - {label: "Services", name: "services", widget: "text"}
          - {label: "Projects heading", name: "projectsHeading", widget: "string"}
          - {label: "Projects intro", name: "projectsIntro", widget: "text"}
          - {label: "Projects body", name: "projectsBody", widget: "text"}
          - {label: "About heading", name: "aboutHeading", widget: "string"}
          - {label: "About lead", name: "aboutLead", widget: "text"}
          - {label: "About body", name: "aboutBody", widget: "text"}
          - {label: "Contact heading", name: "contactHeading", widget: "string"}
          - {label: "Contact text", name: "contactText", widget: "text"}
          - {label: "Email", name: "email", widget: "string", required: false}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - {label: "Copyright", name: "copyright", widget: "string"}
          - label: "Colours"
            name: "colors"
            widget: "object"
            fields:
              - {label: "Cream", name: "cream", widget: "color"}
              - {label: "Mustard", name: "mustard", widget: "color"}
              - {label: "Burgundy", name: "burgundy", widget: "color"}
              - {label: "Warm white", name: "warmWhite", widget: "color"}
              - {label: "Blue", name: "blue", widget: "color"}
          - label: "Fonts"
            name: "fonts"
            widget: "object"
            fields:
              - {label: "Display font", name: "display", widget: "string"}
              - {label: "Body font", name: "body", widget: "string"}
          - label: "Images"
            name: "images"
            widget: "object"
            fields:
              - {label: "Hero", name: "hero", widget: "image"}
              - {label: "About", name: "about", widget: "image"}
              - {label: "Contact", name: "contact", widget: "image"}

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{slug}}"
    fields:
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Project title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Featured", name: "featured", widget: "boolean", default: true}
      - {label: "Cover image", name: "cover", widget: "image"}
      - {label: "Introduction", name: "intro", widget: "text"}
      - label: "Sections"
        name: "sections"
        widget: "list"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Text", name: "text", widget: "text"}
          - {label: "Image", name: "image", widget: "image", required: false}
