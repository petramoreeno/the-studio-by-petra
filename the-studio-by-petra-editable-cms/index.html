<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>The Studio by Petra</title>

  <meta
    name="description"
    content="The Studio by Petra — a portfolio of ideas, strategy, creativity and things brought to life."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #e6ddcf;
      --mustard: #ddb982;
      --burgundy: #7a4c4d;
      --blue: #69a8da;
      --white: #f7f3ed;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background: var(--blue);
      color: var(--cream);

      font-family:
        "Libre Baskerville",
        Georgia,
        serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       GETTING READY PAGE
    ========================= */

    .coming-soon-page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        42px
        6vw
        36px;
    }

    .coming-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coming-brand {
      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          22px,
          2vw,
          30px
        );

      font-weight: 400;
    }

    .coming-status {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }

    .coming-hero {
      flex: 1;

      display: flex;
      align-items: center;

      padding:
        70px
        0
        55px;
    }

    .coming-inner {
      width: min(100%, 1180px);

      margin: 0 auto;
    }

    .coming-eyebrow {
      margin:
        0
        0
        26px;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }

    .coming-title {
      max-width: 1000px;

      margin: 0;

      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          72px,
          10vw,
          150px
        );

      font-weight: 400;

      line-height: 0.88;

      letter-spacing:
        -0.045em;
    }

    .coming-intro {
      max-width: 560px;

      margin:
        46px
        0
        0;

      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          23px,
          2.5vw,
          34px
        );

      line-height: 1.25;
    }

    .coming-label {
      margin-top: 35px;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.13em;
    }

    .coming-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      gap: 30px;

      border-top:
        1px
        solid
        rgba(
          230,
          221,
          207,
          0.45
        );

      padding-top: 24px;
    }

    .coming-socials {
      display: flex;
      align-items: center;

      gap: 24px;
    }

    .coming-social {
      width: 30px;
      height: 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .coming-social:hover {
      opacity: 0.6;

      transform:
        translateY(-2px);
    }

    .coming-social svg {
      width: 25px;
      height: 25px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.5;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .coming-social .fill {
      fill: currentColor;
      stroke: none;
    }

    .coming-copyright {
      font-size: 11px;

      line-height: 1.5;

      text-align: right;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .coming-soon-page {
        padding:
          30px
          6%
          28px;
      }

      .coming-status {
        display: none;
      }

      .coming-hero {
        padding:
          60px
          0
          45px;
      }

      .coming-title {
        font-size:
          clamp(
            62px,
            19vw,
            94px
          );

        line-height: 0.92;
      }

      .coming-intro {
        max-width: 100%;

        margin-top: 34px;

        font-size: 24px;
      }

      .coming-footer {
        flex-direction: column;

        align-items: flex-start;
      }

      .coming-copyright {
        text-align: left;
      }

    }

  </style>

</head>


<body>

  <div id="app"></div>


  <script>

    /* =========================================
       THE STUDIO BY PETRA

       PUBLIC:
       /
       = Coming Soon

       PRIVATE PREVIEW:
       /preview
       = Full Portfolio
    ========================================= */


    const path =
      window.location.pathname
        .replace(/\/+$/, "");


    const isPreview =
      path === "/preview";


    /* =========================================
       PORTFOLIO PREVIEW
    ========================================= */

    if (isPreview) {

      /*
        Load the original portfolio stylesheet.
      */

      const stylesheet =
        document.createElement("link");

      stylesheet.rel =
        "stylesheet";

      stylesheet.href =
        "/styles.css";

      document.head.appendChild(
        stylesheet
      );


      /*
        Change body back to the normal
        portfolio styling.

        styles.css will then take over.
      */

      document.body.style.background =
        "";

      document.body.style.color =
        "";


      /*
        Load the original app.js.

        This means the entire portfolio,
        projects, About, Contact, CMS content,
        etc. continue working normally.
      */

      const portfolioScript =
        document.createElement("script");

      portfolioScript.src =
        "/app.js";

      portfolioScript.defer =
        true;

      document.body.appendChild(
        portfolioScript
      );

    }


    /* =========================================
       PUBLIC COMING SOON PAGE
    ========================================= */

    else {

      document.getElementById(
        "app"
      ).innerHTML = `

        <main
          class="coming-soon-page"
        >


          <!-- TOP -->

          <header
            class="coming-topbar"
          >


            <div
              class="coming-brand"
            >

              The Studio by Petra

            </div>


            <div
              class="coming-status"
            >

              Portfolio in progress

            </div>


          </header>



          <!-- HERO -->

          <section
            class="coming-hero"
          >


            <div
              class="coming-inner"
            >


              <div
                class="coming-eyebrow"
              >

                Something good is coming

              </div>


              <h1
                class="coming-title"
              >

                The Studio<br>

                is getting<br>

                ready.

              </h1>


              <div
                class="coming-intro"
              >

                Ideas are brewing.
                Projects are taking shape.
                A portfolio of strategy,
                creativity and things
                brought to life is coming soon.

              </div>


              <div
                class="coming-label"
              >

                Coming soon.

              </div>


            </div>


          </section>



          <!-- FOOTER -->

          <footer
            class="coming-footer"
          >


            <div
              class="coming-socials"
            >


              <!-- EMAIL -->

              <a
                class="coming-social"
                href="mailto:petra.moreno8@gmail.com"
                aria-label="Email Petra"
                title="Email"
              >


                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="1"
                  ></rect>

                  <path
                    d="M3 7l9 6 9-6"
                  ></path>

                </svg>


              </a>



              <!-- INSTAGRAM -->

              <a
                class="coming-social"
                href="https://www.instagram.com/petramoreeno/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
                title="Instagram"
              >


                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >


                  <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                  ></rect>


                  <circle
                    cx="12"
                    cy="12"
                    r="4"
                  ></circle>


                  <circle
                    class="fill"
                    cx="17.4"
                    cy="6.6"
                    r="1"
                  ></circle>


                </svg>


              </a>



              <!-- LINKEDIN -->

              <a
                class="coming-social"
                href="https://www.linkedin.com/in/petra-moreno-33b009131/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
                title="LinkedIn"
              >


                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >


                  <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="1"
                  ></rect>


                  <circle
                    class="fill"
                    cx="7.3"
                    cy="8"
                    r="1.2"
                  ></circle>


                  <path
                    d="M7.3 10.5v6.3"
                  ></path>


                  <path
                    d="M11 10.5v6.3"
                  ></path>


                  <path
                    d="
                      M11 13.3
                      c0-1.7
                      1.1-3
                      2.8-3
                      1.8 0
                      2.9 1.2
                      2.9 3.2
                      v3.3
                    "
                  ></path>


                </svg>


              </a>


            </div>



            <div
              class="coming-copyright"
            >

              The Studio by Petra<br>

              © 2026 Petra Moreno

            </div>


          </footer>


        </main>

      `;

    }

  </script>

</body>

</html>
