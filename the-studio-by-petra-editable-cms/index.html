<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>The Studio by Petra</title>

  <meta
    name="description"
    content="The Studio by Petra is getting ready. A portfolio of ideas, strategy, creativity and things brought to life."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #e6ddcf;
      --mustard: #ddb982;
      --burgundy: #7a4c4d;
      --blue: #69a8da;
      --white: #f7f3ed;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background: var(--blue);
      color: var(--cream);

      font-family:
        "Libre Baskerville",
        Georgia,
        serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        42px
        6vw
        36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          22px,
          2vw,
          30px
        );

      font-weight: 400;
    }

    .status {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }

    .hero {
      flex: 1;

      display: flex;
      align-items: center;

      padding:
        70px
        0
        55px;
    }

    .hero-inner {
      width: min(100%, 1180px);

      margin: 0 auto;
    }

    .eyebrow {
      margin:
        0
        0
        26px;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }

    h1 {
      max-width: 1000px;

      margin: 0;

      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          72px,
          10vw,
          150px
        );

      font-weight: 400;

      line-height: 0.88;

      letter-spacing:
        -0.045em;
    }

    .intro {
      max-width: 560px;

      margin:
        46px
        0
        0;

      font-family:
        "Bodoni Moda",
        Georgia,
        serif;

      font-size:
        clamp(
          23px,
          2.5vw,
          34px
        );

      line-height: 1.25;
    }

    .coming {
      margin-top: 35px;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.13em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      gap: 30px;

      border-top:
        1px
        solid
        rgba(
          230,
          221,
          207,
          0.45
        );

      padding-top: 24px;
    }

    .socials {
      display: flex;
      align-items: center;

      gap: 24px;
    }

    .social {
      width: 30px;
      height: 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .social:hover {
      opacity: 0.6;

      transform:
        translateY(-2px);
    }

    .social svg {
      width: 25px;
      height: 25px;

      fill: none;

      stroke:
        currentColor;

      stroke-width: 1.5;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    .social .fill {
      fill: currentColor;

      stroke: none;
    }

    .copyright {
      font-size: 11px;

      line-height: 1.5;

      text-align: right;
    }

    @media (max-width: 700px) {

      .page {
        padding:
          30px
          6%
          28px;
      }

      .status {
        display: none;
      }

      .hero {
        padding:
          60px
          0
          45px;
      }

      h1 {
        font-size:
          clamp(
            62px,
            19vw,
            94px
          );

        line-height: 0.92;
      }

      .intro {
        max-width: 100%;

        margin-top: 34px;

        font-size: 24px;
      }

      .footer {
        flex-direction: column;

        align-items: flex-start;
      }

      .copyright {
        text-align: left;
      }
    }

  </style>

</head>


<body>

  <main class="page">

    <header class="topbar">

      <div class="brand">
        The Studio by Petra
      </div>

      <div class="status">
        Portfolio in progress
      </div>

    </header>


    <section class="hero">

      <div class="hero-inner">

        <div class="eyebrow">
          Something good is coming
        </div>

        <h1>
          The Studio<br>
          is getting<br>
          ready.
        </h1>

        <div class="intro">
          Ideas are brewing.
          Projects are taking shape.
          A portfolio of strategy,
          creativity and things
          brought to life is coming soon.
        </div>

        <div class="coming">
          Coming soon.
        </div>

      </div>

    </section>


    <footer class="footer">

      <div class="socials">

        <!-- EMAIL -->

        <a
          class="social"
          href="mailto:petra.moreno8@gmail.com"
          aria-label="Email Petra"
          title="Email"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="1"
            ></rect>

            <path
              d="M3 7l9 6 9-6"
            ></path>

          </svg>

        </a>


        <!-- INSTAGRAM -->

        <a
          class="social"
          href="https://www.instagram.com/petramoreeno/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          title="Instagram"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="5"
            ></rect>

            <circle
              cx="12"
              cy="12"
              r="4"
            ></circle>

            <circle
              class="fill"
              cx="17.4"
              cy="6.6"
              r="1"
            ></circle>

          </svg>

        </a>


        <!-- LINKEDIN -->

        <a
          class="social"
          href="https://www.linkedin.com/in/petra-moreno-33b009131/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          title="LinkedIn"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="1"
            ></rect>

            <circle
              class="fill"
              cx="7.3"
              cy="8"
              r="1.2"
            ></circle>

            <path
              d="M7.3 10.5v6.3"
            ></path>

            <path
              d="M11 10.5v6.3"
            ></path>

            <path
              d="
                M11 13.3
                c0-1.7
                1.1-3
                2.8-3
                1.8 0
                2.9 1.2
                2.9 3.2
                v3.3
              "
            ></path>

          </svg>

        </a>

      </div>


      <div class="copyright">

        The Studio by Petra<br>

        © 2026 Petra Moreno

      </div>

    </footer>

  </main>

</body>

</html>
